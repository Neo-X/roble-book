<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-text">
      <p class="course-code">IFT 6163</p>
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="subtitle">{{ site.description }}</p>
      <p class="instructor"><a href="{{ site.author_url }}" target="_blank">{{ site.author }}</a> &middot; Université de Montréal / Mila</p>
    </div>
    <div class="header-links">
      <a class="btn btn-primary" href="{{ site.youtube_playlist }}" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
        Watch on YouTube
      </a>
      <a class="btn btn-secondary" href="https://github.com/{{ site.github_username }}/roble-book" target="_blank">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  <div class="container">
    <p>
      Course materials by <a href="{{ site.author_url }}" target="_blank">{{ site.author }}</a> &middot;
      <a href="https://mila.quebec" target="_blank">Mila</a> /
      <a href="https://diro.umontreal.ca" target="_blank">Université de Montréal</a>
    </p>
  </div>
</footer>

</body>
</html>
